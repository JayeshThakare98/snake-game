# =============================================================================
# Snake Game backend - local development configuration
# =============================================================================
# Everything here is local-only. No API keys, no external accounts, no cloud
# services, no database.

spring.application.name=snake-game-backend

# Local HTTP port for both the API and the served frontend.
server.port=8080

# Bind to loopback only. The dev server is not reachable from the network.
server.address=127.0.0.1

# Fail fast and loudly on startup problems instead of silently continuing.
spring.main.banner-mode=off

# Serialize java.time values (e.g. Instant) as ISO-8601 strings, not numbers.
spring.jackson.serialization.write-dates-as-timestamps=false

# Never leak internal exception details to clients.
server.error.include-message=never
server.error.include-stacktrace=never

# Quieter logs; raise to DEBUG when troubleshooting.
logging.level.root=INFO
logging.level.com.snakegame=INFO
